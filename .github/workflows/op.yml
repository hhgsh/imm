name: build-op

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.5"
        type: choice
        options:
          - "25.12.5"
          - "25.12.4"
      custom_router_ip:
        description: "设置路由器管理地址"
        required: true
        default: "192.168.0.31"
      profile:
        description: "固件大小 (MB)"
        required: true
        default: "2048"
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
      enable_pppoe:
        description: "是否配置PPPoE拨号"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
      pppoe_account:
        description: "宽带账号"
        required: false
        default: ""
      pppoe_password:
        description: "宽带密码"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: |
          if [ -f "${{ github.workspace }}/x86-64/build25.sh" ]; then
            chmod +x ${{ github.workspace }}/x86-64/build25.sh
          fi

      - name: Save Custom Router IP
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc rsync u-boot-tools zstd wget

      - name: Download and Extract OpenWrt ImageBuilder
        run: |
          luci_version="${{ github.event.inputs.luci_version }}"
          IB_URL="https://downloads.openwrt.org/releases/${luci_version}/targets/x86/64/openwrt-imagebuilder-${luci_version}-x86-64.Linux-x86_64.tar.zst"
          
          echo "Downloading ImageBuilder from: ${IB_URL}"
          wget -q --show-progress "${IB_URL}" -O imagebuilder.tar.zst
          
          mkdir -p /tmp/openwrt
          tar -I zstd -xf imagebuilder.tar.zst -C /tmp/openwrt --strip-components=1
          echo "IMAGEBUILDER_DIR=/tmp/openwrt" >> $GITHUB_ENV
      
      - name: Build openwrt Firmware
        run: |
          cd $IMAGEBUILDER_DIR
          mkdir -p bin files files/etc/config packages extra-packages

          # 1. 克隆第三方 apk 仓库
          echo "Cloning third-party apk repository..."
          git clone --depth=1 https://github.com/hhgsh/apk.git /tmp/store-apk-repo

          # 2. 提取 .run 安装脚本文件
          if [ -d "/tmp/store-apk-repo/run/x86" ]; then
            cp -rf /tmp/store-apk-repo/run/x86/* extra-packages/ 2>/dev/null || true
          fi

          # 3. 递归查找所有 .apk 文件并统一平铺移动到 ImageBuilder 的 packages 目录下
          find /tmp/store-apk-repo -type f -name "*.apk" -exec cp -f {} packages/ \; 2>/dev/null || true

          # 4. 合并工作区中已有的 packages 和 extra-packages
          [ -d "${{ github.workspace }}/packages" ] && find ${{ github.workspace }}/packages -type f -name "*.apk" -exec cp -f {} packages/ \; 2>/dev/null || true
          [ -d "${{ github.workspace }}/extra-packages" ] && cp -rf ${{ github.workspace }}/extra-packages/* extra-packages/ 2>/dev/null || true

          # 5. 复制 shell、files 及配置文件
          [ -d "${{ github.workspace }}/shell" ] && cp -rf ${{ github.workspace }}/shell ./ 2>/dev/null || true
          [ -d "${{ github.workspace }}/files" ] && cp -rf ${{ github.workspace }}/files/* files/ 2>/dev/null || true
          [ -d "${{ github.workspace }}/custom" ] && cp -rf ${{ github.workspace }}/custom/* files/etc/config/ 2>/dev/null || true
          [ -f "${{ github.workspace }}/x86-64/imm25.config" ] && cp -f ${{ github.workspace }}/x86-64/imm25.config .config

          # 6. 导出环境变量并运行编译脚本
          export PROFILE="${{ github.event.inputs.profile }}"
          export INCLUDE_DOCKER="${{ github.event.inputs.include_docker }}"
          export ENABLE_PPPOE="${{ github.event.inputs.enable_pppoe }}"
          export PPPOE_ACCOUNT="${{ github.event.inputs.pppoe_account }}"
          export PPPOE_PASSWORD="${{ github.event.inputs.pppoe_password }}"

          if [ -f "${{ github.workspace }}/x86-64/build25.sh" ]; then
            bash ${{ github.workspace }}/x86-64/build25.sh
          else
            make image
          fi

          # 7. 收集生成的固件文件
          mkdir -p ${{ github.workspace }}/bin/targets/x86/64
          [ -d "bin/targets/x86/64" ] && cp -rf bin/targets/x86/64/* ${{ github.workspace }}/bin/targets/x86/64/ 2>/dev/null || true
          
      - name: Create Release Info
        id: create_release
        run: |
          # 1. 获取 profile 变量并去掉其中的空格（替换为连字符）
          CLEAN_PROFILE=$(echo "${{ github.event.inputs.profile }}" | tr -s ' ' '-')

          # 2. 生成不含空格的合法 Tag 名称
          TAG_NAME="Openwrt-${CLEAN_PROFILE}-$(date +'%Y%m%d-%H%M')"
          echo "release_tag=${TAG_NAME}" >> $GITHUB_OUTPUT

          # 3. 生成 Release 说明内容
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
            <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>

          - 🏠 **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_release.outputs.release_tag }}
          body_path: ${{ github.workspace }}/router-info.md
          files: ${{ github.workspace }}/bin/targets/x86/64/*combined-efi.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
